name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repo + write checks
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy (ubuntu/stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (stable + components)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }} / stable)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache is per-OS; only save on main/develop to keep cache bounded
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: Cargo check (locked)
        run: cargo check --locked --all-targets
      - name: Run tests (locked)
        run: cargo test --locked

  msrv:
    # Enforce the declared MSRV (Cargo.toml rust-version): check + test only,
    # so lint/style drift between rustfmt/clippy versions cannot flake the
    # job while the compiler promise stays enforced.
    name: check + test (MSRV 1.85 / ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (1.85)
        uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: Cargo check (MSRV)
        run: cargo check --locked
      - name: Run tests (MSRV)
        run: cargo test --locked
