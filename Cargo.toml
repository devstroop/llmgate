[package]
name = "llmgate"
version = "0.1.0"
edition = "2024"
description = "Protocol-agnostic LLM API adapter gateway"
license = "MIT"
repository = "https://github.com/devstroop/llmgate"
readme = "README.md"
keywords = ["llm", "gateway", "proxy", "openai", "anthropic", "adapter"]
categories = ["network-programming", "web-programming"]
rust-version = "1.85"

[dependencies]
aho-corasick = "1"
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
# M10 memory substrate: embedded context store. Git-pinned until the nqlite
# crates publish to crates.io (see llmgate-nqlite-scope.md, decision A3);
# swap to version deps then.
nql = { git = "https://github.com/devstroop/nqlite", rev = "3c2b5e1076a628f7d7c124739b9a96a0b08d7b10", package = "nql" }
nqlite = { git = "https://github.com/devstroop/nqlite", rev = "3c2b5e1076a628f7d7c124739b9a96a0b08d7b10", package = "nqlite" }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
