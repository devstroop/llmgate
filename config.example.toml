# llmgate example configuration.
# Copy to config.toml and adjust. Every section is optional; defaults shown.

[client]
# Protocols served to clients. Names must match registered adapters
# (currently: "openai", "anthropic"; "gemini" is upstream-side only).
protocols = ["openai", "anthropic"]

[upstream]
# Protocol the upstream provider speaks ("openai" or "anthropic").
protocol = "openai"
# Provider base URL. The adapter appends its own conversation path
# (openai: /v1/chat/completions, anthropic: /v1/messages).
url = "https://api.example.com"
# Authorization header value sent upstream. Empty = no header.
# Protocols that use a different auth header (e.g. Anthropic x-api-key) add
# extra headers instead (see below).
authorization = "Bearer <your-upstream-api-key>"

# Protocols that use a different auth header add extra headers here instead:
# [[upstream.extra_headers]]
# name = "x-api-key"
# value = "<your-upstream-api-key>"

# Timeout for NON-streaming upstream requests, in milliseconds. Streaming
# requests deliberately have no total timeout — the stream is bounded by the
# SSE protocol itself ([DONE] / message_stop / connection close) so long
# generations are not cut off mid-stream. The TCP connect timeout is a fixed
# 10s regardless.
timeout_ms = 60_000

[models]
# Fallback model when the resolved name is empty.
default = ""
# Client-requested model name -> upstream model name.
# [models.map]
# "gpt-4o" = "claude-3-5-sonnet"
# Prefixes stripped from requested model names before map lookup.
prefixes = []

[server]
# Loopback by default: bind a non-loopback interface only when you have
# authentication (or another network boundary) in front of the gateway.
host = "127.0.0.1"
port = 5000

[auth]
# Accepted client API keys. Empty = all requests allowed. Requests must
# present a key via `Authorization: Bearer <key>`, `api-key: <key>`, or
# `x-api-key: <key>`. Key comparison is constant-time and bounded by the
# longest configured key; empty/whitespace-only keys are rejected at startup.
api_keys = []

[privacy_guard]
# Zero-trust reversible redaction. Disabled by default; when enabled, the
# gateway replaces sensitive entities with tokens before forwarding and
# restores them in the response, so the upstream provider never sees PII
# and the client never sees tokens.
enabled = false
# Vault backend. Only "memory" (session-scoped, per-request) is
# implemented; any other value is a startup error (fail closed).
vault = "memory"

# Custom rules are applied in order to every text-bearing content block.
# When `rules` is empty and `enabled = true`, a built-in conservative set
# is used (email, IPv4, US phone, API keys).
# [[privacy_guard.rules]]
# name = "INTERNAL_IP"
# pattern = '\b10\.\d{1,3}\.\d{1,3}\.\d{1,3}\b'
# replacement = "<IP_{n}>"   # must contain {n}

# Matches exempt from redaction.
# [privacy_guard.allow_list]
# domains = ["devstroop.com"]           # emails/URLs on these domains pass through
# patterns = ['\bfoo@example\.com\b']   # regex-exempt matches

[memory]
# M10 embedded observability store (nqlite, single file + WAL). Disabled by
# default. When enabled, every request is logged as a JSON record (model,
# protocols, latency, status, token usage) in the database at `path`.
enabled = false
# Path to the nqlite database file. Required when enabled = true (startup
# fails otherwise — fail closed). The parent directory is created if missing.
# path = "llmgate.nql"
# Retention for request records in hours (0 = keep forever). Expired
# records are FORGETten on the flush cadence.
# ttl_hours = 0
# Seconds between WAL checkpoints and TTL sweeps (default 30).
# flush_interval_secs = 30

# Query the store offline with the nql CLI (from the nqlite workspace):
#   cargo run -p nql-cli --release -- --db llmgate.nql \
#     --script "SELECT * FROM request ORDER BY ::recency LIMIT 20;"
